<title>THE STARTUP TRAIL</title>
<style>
  :root { --bg: #000000; --fg: #33ff33; --dim: #1f7a1f; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: "Courier New", Courier, ui-monospace, monospace;
    font-size: 18px; line-height: 1.35; min-height: 100%;
  }
  body { padding: 12px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  #crt {
    max-width: 42rem; margin: 0 auto; min-height: calc(100vh - 24px);
    border: 2px solid var(--fg); padding: 16px 16px 20px;
    display: flex; flex-direction: column;
  }
  header.hud {
    border-bottom: 1px solid var(--dim); padding-bottom: 8px; margin-bottom: 12px;
    color: var(--dim); font-size: 0.95rem; white-space: pre-wrap;
  }
  header.hud strong { color: var(--fg); font-weight: normal; }
  #art {
    white-space: pre; font-size: 0.85rem; line-height: 1.15;
    color: var(--fg); overflow-x: auto; margin: 0 0 12px;
  }
  #text { white-space: pre-wrap; flex: 1; margin: 0 0 14px; }
  .dim { color: var(--dim); }
  input[type="text"], input[type="number"] {
    background: var(--bg); color: var(--fg); border: 2px solid var(--fg);
    font: inherit; padding: 10px 12px; width: 100%; outline: none;
    border-radius: 0; margin: 8px 0 12px;
  }
  input:focus { background: #000000; }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
  button {
    background: var(--bg); color: var(--fg); border: 2px solid var(--fg);
    font: inherit; text-align: left; padding: 12px 14px; min-height: 48px;
    cursor: pointer; border-radius: 0; width: 100%;
  }
  button:hover, button:focus { background: var(--fg); color: var(--bg); outline: none; }
  button:disabled { border-color: var(--dim); color: var(--dim); cursor: not-allowed; }
  button:disabled:hover { background: var(--bg); color: var(--dim); }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .log {
    color: var(--dim); max-height: 8rem; overflow-y: auto; white-space: pre-wrap;
    margin-bottom: 10px; border-top: 1px solid var(--dim); padding-top: 8px;
  }
  #hunt-field {
    white-space: pre; font-size: 0.9rem; line-height: 1.1; min-height: 7.5rem;
    border: 1px solid var(--dim); padding: 8px; margin-bottom: 10px;
  }
</style>
</head>

      if (chance(0.18 + restBonus) && p.daysIll >= 2) {
        log(S, story("recover", { name: p.name, illness: ill.name }));
        p.illness = null; p.daysIll = 0;
        p.health = clamp(p.health + 1, 1, 5);
      } else if (chance(0.08 + (ill.severity * 0.03) - restBonus)) {
        p.health = clamp(p.health - 1, 0, 5);
        if (p.health <= 0) checkDeaths(S, ill.name);
      }
    });
  }

  function tickDailyHealth(S) {
    const used = rationUse(S);
    if (S.ramen >= used) {
      S.ramen -= used;
      if (S.rations === "filling") alive(S).forEach(p => { if (!p.illness && chance(0.25)) p.health = clamp(p.health + 1, 0, 5); });
      if (S.rations === "bare") alive(S).forEach(p => { if (chance(0.2)) p.health = clamp(p.health - 1, 0, 5); });
    } else {
      S.ramen = 0;
      damageHealth(S, 1, "an empty snack drawer");
      log(S, story("outOfRamen"));
    }
    const drain = S.pace === "grueling" ? 2 : S.pace === "strenuous" ? 1 : 0;
    if (drain && S.battery > 0) S.battery = Math.max(0, S.battery - drain);
    if (winterish(S)) {
      const need = livingCount(S) * 2;
      if (S.chargers < need && chance(0.35)) {
        const p = pick(alive(S));
        if (p && !p.illness) infect(S, p, ILLNESSES.find(i => i.id === "wifi"));
        else damageHealth(S, 1, "Wi-Fi withdrawal");
        log(S, story("chargersLow", { name: (alive(S)[0] || { name: "Someone" }).name }));
      }
    }
    tickIllness(S);
    checkDeaths(S);
  }

  function endGame(S, win, msg) {
    if (S.over) return;
    S.over = true; S.win = win; S.endMessage = msg;
    S.score = computeScore(S);
    if (win) saveScore(S);
    clearSave();
    showEnd();
  }

  function computeScore(S) {
    if (!S.win) return 0;
    let pts = Math.round(S.cash) + Math.round(S.battery / 2) + Math.round(S.ramen / 2) + S.chargers * 5 + S.totes * 2;
    pts += S.tires * 5 + S.gpus * 20;
    alive(S).forEach(p => { pts += 50 * p.health; });
    if (monthIndex(S.date) <= 7) pts += 200;
    else if (monthIndex(S.date) === 8) pts += 100;
    const own = (typeof S.ownership === "number" ? S.ownership : 100) / 100;
    return Math.round(pts * FLAVORS[S.flavor].multiplier * own);
  }

  function loadScores() { try { return JSON.parse(localStorage.getItem(SCORES_KEY) || "[]"); } catch (e) { return []; } }
  function saveScore(S) {
    const list = loadScores();
    list.push({ name: S.founder, startup: S.startup, flavor: FLAVORS[S.flavor].name, score: S.score, date: fmtDate(S.date) });
    list.sort((a, b) => b.score - a.score);
    localStorage.setItem(SCORES_KEY, JSON.stringify(list.slice(0, 10)));
  }
  function saveGame() {
    if (!S || S.over) return;
    const copy = Object.assign({}, S);
    copy.date = S.date.toISOString();
    localStorage.setItem(SAVE_KEY, JSON.stringify(copy));
  }
  function loadGame() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const g = JSON.parse(raw);
      g.date = new Date(g.date);
      if (typeof g.ownership !== "number") g.ownership = 100;
      if (typeof g.lastPitchMile !== "number") g.lastPitchMile = 0;
      if (typeof g.investorOffers !== "number") g.investorOffers = 0;
      if (typeof g.investorPitches !== "number") g.investorPitches = 0;
      if (!g.lastStory || typeof g.lastStory !== "object") g.lastStory = {};
      return g;
    } catch (e) { return null; }
  }
  function clearSave() { localStorage.removeItem(SAVE_KEY); }

  function clearUI() {
    el.extra.innerHTML = "";
    el.choices.innerHTML = "";
    el.art.textContent = "";
    if (keyHandler) { document.removeEventListener("keydown", keyHandler); keyHandler = null; }
  }
  function setText(t) { el.text.textContent = t; }
  function setArt(t) { el.art.textContent = t || ""; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function showHud(show) {
    if (!show || !S || !S.started || S.over) { el.hud.hidden = true; el.log.hidden = true; return; }
    el.hud.hidden = false;
    const lm = nextLm(S);
    el.hud.innerHTML =
      "<strong>" + escapeHtml(S.startup) + "</strong>  |  " + fmtDate(S.date) + "\n" +
      "Weather: " + S.weather + "   Health: " + partyHealth(S) + "   Ramen: " + Math.round(S.ramen) + " pks   Battery: " + S.battery + " kWh\n" +
      "Miles: " + S.miles + "   Next: " + lm.name + " (" + milesToNext(S) + " mi)   Ownership: " + Math.round(S.ownership) + "%";
    if (S.log.length) { el.log.hidden = false; el.log.textContent = S.log.slice(0, 4).join("\n"); }
    else el.log.hidden = true;
  }

  function choices(items) {
    el.choices.innerHTML = "";
    const map = {};
    items.forEach((it, i) => {
      const num = it.num || (i + 1);
      map[String(num)] = it;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = num + ". " + it.label;
      if (it.disabled) b.disabled = true;
      b.addEventListener("click", () => { if (!b.disabled) it.fn(); });
      el.choices.appendChild(b);
    });
    keyHandler = function (e) {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      const it = map[e.key];
      if (it && !it.disabled) { e.preventDefault(); it.fn(); }
    };
    document.addEventListener("keydown", keyHandler);
  }

  function askText(placeholder, value, onSubmit, buttonLabel) {
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = placeholder;
    input.value = value || "";
    input.maxLength = 24;
    input.autocomplete = "off";
    input.spellcheck = false;
    el.extra.appendChild(input);
    setTimeout(() => input.focus(), 50);
    const go = () => onSubmit(input.value.trim());
    input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    choices([{ label: buttonLabel || "Continue", fn: go }]);
  }

      { label: "Learn about the trail", fn: showLearn },

      "Buy battery charge (kWh) for the company EV, ramen and snacks for the team, phone chargers, tote bags for drone drops, spare tires, and spare GPUs. Choose a pace and a ration. Grab snacks when stores run low. Rest when the team is burnt out.\n\n" +

  function pricesAt(kind) {
    const markup = kind === "fort" ? 1.5 : kind === "dalles" ? 2 : 1;
    const out = {};
    STORE_ITEMS.forEach(it => { out[it.key] = it.price * markup; });
    return out;
  }

  function openStore(isStart, kind) {
    ui.screen = "store";
    ui.storeKind = isStart ? "start" : (kind || "fort");
    ui.storeBuy = { battery: 0, ramen: 0, chargers: 0, totes: 0, tires: 0, gpus: 0 };
    if (isStart) S = newGame(setup);
    renderStore();
  }

  function renderStore() {
    clearUI(); showHud(false); el.log.hidden = true; setArt(ART.store);
    const loc = ui.storeKind === "start" ? "start" : (S && nextLm(S).name === "Las Vegas Loop tunnel" ? "dalles" : "fort");
    const prices = pricesAt(loc);
    const spent = STORE_ITEMS.reduce((s, it) => s + (ui.storeBuy[it.key] || 0) * prices[it.key], 0);
    const left = S.cash - spent;
    let t = (ui.storeKind === "start"
      ? "Matt's Charging & General, Dallas.\n\"We outfit founders heading west to Demo Day.\"\n\n"
      : "The depot clerk looks over your EV.\nPrices are higher than they were in Dallas.\n\n");
    t += "Runway on hand: " + money(S.cash) + "\nThis bill: " + money(spent) + "   After purchase: " + money(left) + "\n\n";
    t += ui.storeKind === "start" ? "Already in the EV: nothing. You must buy everything here.\n" : suppliesText(S, true) + "\n";
    setText(t);

    STORE_ITEMS.forEach(it => {
      const row = document.createElement("div");
      row.className = "row";
      row.style.marginBottom = "6px";
      const lab = document.createElement("div");
      lab.style.flex = "2";
      lab.style.paddingTop = "10px";
      const qty = ui.storeBuy[it.key] || 0;
      lab.textContent = it.label + "  " + money(prices[it.key]) + (it.unit ? "/" + it.unit : "") + "   x" + qty;
      const minus = document.createElement("button");
      minus.type = "button"; minus.textContent = "-"; minus.style.flex = "0 0 48px";
      minus.addEventListener("click", () => { ui.storeBuy[it.key] = Math.max(0, (ui.storeBuy[it.key] || 0) - it.step); renderStore(); });
      const plus = document.createElement("button");
      plus.type = "button"; plus.textContent = "+"; plus.style.flex = "0 0 48px";
      plus.addEventListener("click", () => {
        const next = (ui.storeBuy[it.key] || 0) + it.step;
        const newSpent = spent - (ui.storeBuy[it.key] || 0) * prices[it.key] + next * prices[it.key];
        if (newSpent <= S.cash + 0.001) { ui.storeBuy[it.key] = next; renderStore(); }
      });
      row.appendChild(lab); row.appendChild(minus); row.appendChild(plus);
      el.extra.appendChild(row);
    });

    const items = [{ label: "Pay the bill and load the EV", fn: () => checkoutStore(prices, spent) }];
    if (ui.storeKind !== "start") items.push({ label: "Leave the store", fn: showTrail });
    else items.push({ label: "Ask Matt for advice", fn: storeAdvice });
    choices(items);
  }

  function storeAdvice() {
    clearUI(); setArt(ART.store);
    setText("Matt says:\n\n\"Don't skimp on battery or ramen. Eighty kilowatt-hours and two hundred snack packs a head will get most teams to San Francisco. Buy spare tires. Buy chargers before the West Texas dead zone. You can catch drone deliveries, but a tote ain't dinner until you grab something.\n\nLeave in March. Later than May and the heat, the lines, and the Valley calendar may catch you short of Demo Day, founder or not.\"");
    choices([{ label: "Back to the store", fn: renderStore }]);
  }

  function checkoutStore(prices, spent) {
    if (ui.storeKind === "start" && (ui.storeBuy.battery || 0) < 10) {
      clearUI();
      setText("You'll need battery charge to move the company EV. Buy at least 10 kWh. Forty to eighty is the real plan.");
      choices([{ label: "Back to the store", fn: renderStore }]);
      return;
    }
    if (spent > S.cash + 0.001) return;
    S.cash = Math.round((S.cash - spent) * 100) / 100;
    STORE_ITEMS.forEach(it => { S[it.key] += ui.storeBuy[it.key] || 0; });
    if (ui.storeKind === "start") {
      S.started = true;
      log(S, S.startup + " leaves Dallas, bound for Demo Day.");
      showLandmark(LANDMARKS[0], true);
    } else {
      log(S, "You bought supplies at the fort.");
      saveGame(); showTrail();
    }
  }

  function suppliesText(S, compact) {
    const lines = [
      "Battery: " + S.battery + " kWh",
      "Ramen and snacks: " + Math.round(S.ramen) + " packs",
      "Phone chargers: " + S.chargers,
      "Totes: " + S.totes,
      "Spare tires: " + S.tires,
      "Spare GPUs: " + S.gpus,
      "Runway: " + money(S.cash)
    ];
    return (compact ? "" : "COMPANY STORES\n\n") + lines.join(compact ? "   " : "\n");
  }

  function showTrail() {
    if (!S || S.over) return S && S.over ? showEnd() : showTitle();
    ui.screen = "trail";
    ui.eventOpen = false;
    ui.pending = null;
    clearUI(); showHud(true); setArt(ART.wagon);
    const team = alive(S).map(p => p.name + " (" + p.role + ", " + healthWord(p) + (p.illness ? ", " + ((ILLNESSES.find(i => i.id === p.illness) || {}).name || "") : "") + ")").join("\n");
    setText(S.founder + " leads " + S.startup + " west.\nPace: " + S.pace + "    Rations: " + S.rations + "\n\n" + team);
    choices([
      { label: "Continue on the road", fn: () => travelDay(true) },
      { label: "Check supplies", fn: showSupplies },
      { label: "Look at the map", fn: showMap },
      { label: "Change pace", fn: showPace },
      { label: "Change snack rations", fn: showRations },
      { label: "Stop to rest", fn: showRest },
      { label: "Attempt to trade", fn: attemptTrade },
      { label: "Grab snacks / catch a drone", fn: startHunt },
      { label: "Talk to the team", fn: talkTeam }
    ]);
    saveGame();
  }

  function showSupplies() {
    clearUI(); showHud(true); setArt(""); setText(suppliesText(S, false));
    choices([{ label: "Back", fn: showTrail }]);
  }

  function showMap() {
    clearUI(); showHud(true);
    let lines = "THE ROAD TO DEMO DAY\n\n";
    LANDMARKS.forEach(lm => {
      let mark = "  ";
      if (lm.mile <= S.miles) mark = "*";
      if (LANDMARKS[Math.min(S.nextLandmark, LANDMARKS.length - 1)].mile === lm.mile && S.miles < lm.mile) mark = ">";
      lines += mark + " " + String(lm.mile).padStart(4, " ") + "  " + lm.name + "\n";
    });
    lines += "\n* visited   > next   you have traveled " + S.miles + " miles";
    setArt(lines); setText("");
    choices([{ label: "Back", fn: showTrail }]);
  }

  function showPace() {

    setText("Change the company's pace.\n\nSteady is safer. Strenuous covers ground. Grueling is a crunch: fast, and it will wear the team down.");
    choices([
      { label: "Steady (about 20 miles a day)", fn: () => { S.pace = "steady"; showTrail(); } },
      { label: "Strenuous (about 30 miles a day)", fn: () => { S.pace = "strenuous"; showTrail(); } },
      { label: "Grueling (about 40 miles a day)", fn: () => { S.pace = "grueling"; showTrail(); } },
      { label: "Back", fn: showTrail }
    ]);
  }

  function showRations() {
    clearUI(); showHud(true);
    setText("Change snack rations.\n\nFilling keeps the team strong. Meager stretches the ramen. Bare bones is a last resort.");
    choices([
      { label: "Filling (3 snack packs per person per day)", fn: () => { S.rations = "filling"; showTrail(); } },
      { label: "Meager (2 snack packs per person per day)", fn: () => { S.rations = "meager"; showTrail(); } },
      { label: "Bare bones (1 snack pack per person per day)", fn: () => { S.rations = "bare"; showTrail(); } },
      { label: "Back", fn: showTrail }
    ]);
  }

  function showRest() {
    clearUI(); showHud(true);
    setText("How many days will the company rest?\nThe team may recover. Ramen will still be eaten. The battery will still drain a little.");
    choices([
      { label: "1 day", fn: () => restDays(1) },
      { label: "2 days", fn: () => restDays(2) },
      { label: "3 days", fn: () => restDays(3) },
      { label: "5 days", fn: () => restDays(5) },
      { label: "Back", fn: showTrail }
    ]);
  }

  function restDays(n) {
    ui.eventOpen = false;
    for (let i = 0; i < n; i++) {
      if (S.over) return;
      S.date = addDays(S.date, 1);
      setWeather(S);
      const savedPace = S.pace;
      S.pace = "steady";
      tickDailyHealth(S);
      S.pace = savedPace;
      if (S.over) return;
      alive(S).forEach(p => { if (chance(0.45)) p.health = clamp(p.health + 1, 0, 5); });
      if (maybeRandomEvent(0.08) || ui.eventOpen) {
        if (!S.over && !ui.eventOpen) {
          /* event resolved immediately by returning to trail; keep remaining rest only if still on trail */
        } else {
          return;
        }
      }
    }
    if (!S.over && !ui.eventOpen) {
      log(S, story("restDays", { days: plural(n, "day") }));
      showTrail();
    }
  }

  function attemptTrade() {
    clearUI(); showHud(true);
    if (chance(0.45)) {
      setText(story("tradeNone"));
      choices([{ label: "Back", fn: showTrail }]);
      return;
    }
    const offers = [
      { want: { ramen: 50 }, give: { totes: 1 }, text: "A roving engineer offers 1 tote for 50 packs of ramen." },
      { want: { totes: 2 }, give: { ramen: 80 }, text: "Another founder offers 80 snack packs for 2 totes." },
      { want: { chargers: 1 }, give: { ramen: 40 }, text: "A trader offers 40 snack packs for 1 phone charger." },
      { want: { battery: 10 }, give: { ramen: 200, cash: 20 }, text: "A van life couple offers 200 snack packs and $20 for 10 kWh off your pack." },
      { want: { cash: 15 }, give: { tires: 1 }, text: "A shop offers a spare tire for $15." },
      { want: { cash: 40 }, give: { gpus: 1 }, text: "A stall offers a spare GPU for $40." },
      { want: { cash: 25 }, give: { battery: 20 }, text: "A Supercharger attendant sells you 20 kWh for $25." },
      { want: { ramen: 30 }, give: { chargers: 1 }, text: "A rider offers a phone charger for 30 snack packs." },
      { want: { totes: 1, ramen: 20 }, give: { chargers: 1 }, text: "A courier offers a phone charger for 1 tote and 20 snack packs." },
      { want: { cash: 10 }, give: { chargers: 1 }, text: "A kiosk sells a slightly scuffed charger for $10." },
      { want: { gpus: 1 }, give: { ramen: 120 }, text: "A lab intern offers 120 snack packs for 1 spare GPU." },
      { want: { cash: 30 }, give: { totes: 2 }, text: "A fleet driver will part with 2 totes for $30." },
      { want: { tires: 1 }, give: { ramen: 70, cash: 10 }, text: "A roadside cart offers 70 snack packs and $10 for a spare tire." },
      { want: { ramen: 80 }, give: { battery: 15 }, text: "Someone with a portable pack offers 15 kWh for 80 snack packs." },
      { want: { cash: 8 }, give: { ramen: 50 }, text: "A vending restocker sells a crate of 50 snack packs for $8." },
      { want: { chargers: 2 }, give: { tires: 1 }, text: "A swap-meet stall offers a spare tire for 2 phone chargers." },
      { want: { battery: 15 }, give: { gpus: 1 }, text: "A researcher offers a spare GPU for 15 kWh off your pack." },
      { want: { cash: 35 }, give: { chargers: 3 }, text: "A wholesale crate of 3 chargers can be yours for $35." },
      { want: { ramen: 25 }, give: { totes: 1 }, text: "A camper trades 1 tote for 25 snack packs and a story you do not need." },
      { want: { cash: 18 }, give: { ramen: 90, chargers: 1 }, text: "A closing stall dumps 90 snack packs and a charger for $18." }
    ];
    const offer = pickFrom("tradeOffer", offers);
    setText(story("tradeIntro", { offer: offer.text }));
    const can = Object.keys(offer.want).every(k => (k === "cash" ? S.cash : S[k]) >= offer.want[k]);
    choices([
      { label: "Accept the trade", disabled: !can, fn: () => {
        Object.entries(offer.want).forEach(([k, v]) => { if (k === "cash") S.cash -= v; else S[k] -= v; });
        Object.entries(offer.give).forEach(([k, v]) => { if (k === "cash") S.cash += v; else S[k] += v; });
        log(S, story("tradeYes")); showTrail();
      }},
      { label: can ? "Refuse" : "You cannot afford this. Leave.", fn: showTrail }
    ]);
  }

  function talkTeam() {
    clearUI(); showHud(true);
    const lines = alive(S).map(p => {
      const v = { name: p.name, illness: p.illness ? ILLNESSES.find(i => i.id === p.illness).name : "", role: p.role };
      if (p.illness) return story("talkIll", v);
      if (p.health <= 2) return story("talkWorn", v);
      if (S.ramen < livingCount(S) * 20) return story("talkHungry", v);
      if (S.pace === "grueling") return story("talkCrunch", v);
      if (p.role === "Founder") return story("talkFounder", v);
      if (p.role === "Cofounder") return story("talkCofounder", v);
      if (p.role === "Engineer") return story("talkEngineer", v);
      return story("talkOperator", v);
    });
    setText(lines.join("\n\n"));
    choices([{ label: "Back", fn: showTrail }]);
  }

  function startHunt() {
    if (S.totes < 1 && !(S._rounds > 0)) {
      clearUI(); showHud(true);
      setText(story("huntNoTotes"));
      choices([{ label: "Back", fn: showTrail }]);
      return;
    }
    if (!(S._rounds > 0)) { S.totes -= 1; S._rounds = 20; }
    ui.hunt = { time: 12, shots: 0, bagged: 0, running: true, animal: null };
    spawnAnimal();
    renderHunt();
    ui.hunt.timer = setInterval(() => {
      if (!ui.hunt || !ui.hunt.running) return;
      ui.hunt.time -= 1;
      if (ui.hunt.animal) ui.hunt.animal.x += ui.hunt.animal.vx;
      if (ui.hunt.time <= 0) endHunt();
      else renderHunt();
    }, 1000);
  }

  function spawnAnimal() {
    const kinds = [
      { name: "loose snack bag", food: 2, ch: "s", vx: 2 },
      { name: "charging-stop tote", food: 8, ch: "t", vx: 2 },
      { name: "drone delivery", food: 40, ch: "d", vx: 1 },
      { name: "pallet drop", food: 200, ch: "P", vx: 1 }
    ];
    const w = kinds[Math.random() < 0.5 ? rand(2) : (Math.random() < 0.7 ? 2 : 3)];
    ui.hunt.animal = { name: w.name, food: w.food, ch: w.ch, x: 2, vx: w.vx, y: 1 + rand(3) };
  }

  function huntField() {
    const W = 28, H = 5, rows = [];
    for (let y = 0; y < H; y++) {
      let row = "";
      for (let x = 0; x < W; x++) {
        const a = ui.hunt.animal;
        if (a && y === a.y && x === clamp(Math.round(a.x), 0, W - 1)) row += a.ch;
        else row += (y === H - 1 ? "_" : " ");
      }
      rows.push(row);
    }
    return rows.join("\n");
  }

  function renderHunt() {
    const keepTimer = ui.hunt && ui.hunt.timer;
    clearUI();
    if (ui.hunt) ui.hunt.timer = keepTimer;
    showHud(true);
    const a = ui.hunt.animal;
    const field = document.createElement("pre");
    field.id = "hunt-field";
    field.textContent = huntField();
    el.extra.appendChild(field);
    setText(
      "Charging-stop snack run.\nGrabs left in this tote: " + S._rounds +
      "\nTime left: " + ui.hunt.time + "   Bagged: " + ui.hunt.bagged + " packs" +
      (a ? "\nA " + a.name + " is in range. Grab it when ready." : "\nThe lot is still.")
    );
    choices([
      { label: "Grab", disabled: S._rounds <= 0, fn: fireHunt },
      { label: "Leave the stop", fn: endHunt }
    ]);
  }

  function fireHunt() {
    if (!ui.hunt || S._rounds <= 0) return;
    S._rounds -= 1;
    ui.hunt.shots++;
    const a = ui.hunt.animal;
    const inSight = a && a.x >= 0 && a.x <= 27;
    const hit = inSight && chance(a.name === "pallet drop" ? 0.45 : a.name === "drone delivery" ? 0.55 : 0.65);
    if (hit) {
      ui.hunt.bagged += a.food;
      ui.hunt.animal = null;
      if (ui.hunt.time > 3 && chance(0.6)) spawnAnimal();
    } else if (a && chance(0.5)) a.vx += 1;
    if (S._rounds <= 0 || ui.hunt.time <= 0) endHunt();
    else renderHunt();
  }

  function endHunt() {
    if (ui.hunt && ui.hunt.timer) { clearInterval(ui.hunt.timer); ui.hunt.running = false; }
    const bagged = ui.hunt ? ui.hunt.bagged : 0;
    ui.hunt = null;
    S.date = addDays(S.date, 1);
    setWeather(S);
    tickDailyHealth(S);
    const cap = 200;
    const got = Math.min(bagged, cap);
    S.ramen += got;
    const hv = { n: got, name: (alive(S)[0] || { name: "Someone" }).name };
    if (bagged > cap) log(S, story("huntOverflow", hv));
    else if (got) log(S, story("huntSuccess", hv));
    else log(S, story("huntEmpty"));
    if (!S.over) {
      clearUI(); showHud(true);
      setText(got ? story("huntSuccess", hv) : story("huntEmpty"));
      choices([{ label: "Continue", fn: showTrail }]);
    }
  }

  const PITCH_SETUPS = [
    { title: "Supercharger angel", text: "An angel investor flags you down at a Supercharger. They have a quarter-zip, a curiosity about your prototype, and five minutes before their pack hits 80%." },
    { title: "Truck-stop VC", text: "A VC sees your demo at a truck stop. They watched the whole pitch over your shoulder from the nacho line and now they want the official version." },
    { title: "Buc-ee's shark tank", text: "A shark-tank-style pitch breaks out at a Buc-ee's. Someone has set up a folding table by the beaver mascot and is taking meetings between brisket sandwiches." },
    { title: "Hotel-lobby family office", text: "A family office intern in a hotel lobby overheard your standup. Their principal is upstairs, 'has dry powder,' and can be down in ten minutes if you stay." },
    { title: "Same-line seed partner", text: "A seed fund partner is stuck in the same Supercharger line. They have already looked up your startup on their phone. They would like a deck, or failing that, a story." },

  function dilute(S, pct) {
    S.ownership = Math.max(5, Math.round((S.ownership - pct) * 10) / 10);
  }

  function maybePitchEvent() {
    if (S.over || !S.started) return false;
    const since = S.miles - (S.lastPitchMile || 0);
    if (since < 80) return false;
    const p = since > 400 ? 0.35 : 0.1;
    if (!chance(p)) return false;
    S.lastPitchMile = S.miles;
    S.investorOffers = (S.investorOffers || 0) + 1;
    startPitch();
    return true;
  }

  function startPitch() {
    const setup = pickFrom("pitchSetup", PITCH_SETUPS);
    S.lastPitchTitle = setup.title;
    showEvent("", setup.text + "\n\n" + story("pitchAsk", { ownership: Math.round(S.ownership) }), [
      { label: "Pitch", fn: () => resolvePitch(setup) },
      { label: "Wave them off and keep driving", fn: () => {
        log(S, story("pitchSkip", { title: setup.title }));
        showTrail();
      }}
    ]);
  }

  function resolvePitch(setup) {
    S.investorPitches = (S.investorPitches || 0) + 1;
    S.date = addDays(S.date, 1);
    if (S.ramen >= 5) S.ramen -= 5;
    tickDailyHealth(S);
    if (S.over) return;
    const roll = Math.random();
    let msg;
    const pv = { ownership: Math.round(S.ownership), startup: S.startup, name: founder(S).name, n: "", cut: "", dilute: "" };
    if (roll < 0.20) {
      const n = 250 + rand(201);
      S.cash += n;
      const cut = chance(0.5) ? 5 + rand(4) : 0;
      if (cut) dilute(S, cut);
      pv.n = money(n); pv.cut = cut; pv.ownership = Math.round(S.ownership);
      pv.dilute = cut ? story("pitchBigDilute", pv) : story("pitchBigClean", pv);
      log(S, "You raised a big round: +" + money(n) + (cut ? ", diluted " + cut + "%." : "."));
      msg = story("pitchBig", pv);
    } else if (roll < 0.48) {
      const n = 40 + rand(51);
      S.cash += n;
      pv.n = money(n); pv.ownership = Math.round(S.ownership);
      log(S, "A small check landed: +" + money(n) + ".");
      msg = story("pitchSmall", pv);
    } else if (roll < 0.70) {
      log(S, "You got ghosted after a pitch.");
      msg = story("pitchGhost", pv);
    } else if (roll < 0.88) {
      const n = 180 + rand(141);
      const cut = 20 + rand(11);
      S.cash += n;
      dilute(S, cut);
      pv.n = money(n); pv.cut = cut; pv.ownership = Math.round(S.ownership);
      log(S, "A brutal term sheet: +" + money(n) + ", lost " + cut + "% ownership.");
      msg = story("pitchBrutal", pv);
    } else {
      const n = Math.min(S.cash, 20 + rand(61));
      S.cash = Math.round((S.cash - n) * 100) / 100;
      pv.n = money(n); pv.ownership = Math.round(S.ownership);
      log(S, "A scam investor took " + money(n) + ".");
      msg = story("pitchScam", pv);
    }
    showEvent("", "You pitched (" + setup.title + ").\n\n" + msg, [{ label: "Continue", fn: showTrail }]);
  }

  function travelDay() {
    if (S.over) return showEnd();
    setWeather(S);
    const move = paceMiles(S);
    const toNext = milesToNext(S);
    const reached = move >= toNext;
    S.miles += reached ? toNext : move;
    S.date = addDays(S.date, 1);
    tickDailyHealth(S);
    if (S.over) return;
    if (S.pace === "grueling" && chance(0.12)) {
      const p = pick(alive(S));
      if (p && !p.illness) infect(S, p, ILLNESSES.find(i => i.id === "burnout"));
    }
    if (reached) { arriveLandmark(); return; }
    if (maybePitchEvent()) return;
    if (chance(0.04) && S.miles > 40) {
      showEvent(ART.grave, story("roadGrave"), [{ label: "Continue", fn: showTrail }]);
      log(S, "You passed a grave on the trail.");
      return;
    }
    if (maybeRandomEvent(0.28)) return;
    showTrail();
  }

  function arriveLandmark() {
    const lm = nextLm(S);
    S.nextLandmark = Math.min(S.nextLandmark + 1, LANDMARKS.length - 1);
    log(S, "You have reached " + lm.name + ".");
    if (lm.type === "end") { showDemoDay(); return; }
    showLandmark(lm, false);
  }

    if (lm.obstacle === "traffic") return ART.traffic;

    if (lm.type === "fort") return ART.fort;
    if (lm.name.indexOf("Pass") >= 0 || lm.name.indexOf("Mojave") >= 0 || lm.name.indexOf("dead zone") >= 0 || lm.name.indexOf("desert") >= 0) return ART.mountain;
    if (lm.name.indexOf("Starbase") >= 0) return ART.rock;
    if (lm.type === "end" || lm.type === "start") return ART.town;
    return ART.wagon;
  }

  function showLandmark(lm, isStart) {
    clearUI(); S.started = true; showHud(true);
    setArt(landmarkArt(lm));
    const blurbs = LANDMARK_BLURBS[lm.name];
    const blurb = Array.isArray(blurbs) ? pickFrom("lm:" + lm.name, blurbs) : (blurbs || ("You have reached " + lm.name + "."));
    setText("You have reached " + lm.name + ".\n\n" + blurb);
    const items = [];
    if (lm.type === "river") items.push({ label: lm.obstacle === "traffic" ? "Look at the merge" : "Look at the crossing", fn: () => riverMenu(lm) });
    else if (isStart) items.push({ label: "Hit the road", fn: showTrail });
    else {
      items.push({ label: "Continue on the road", fn: showTrail });
      if (lm.type === "fort") {
        items.push({ label: "Buy supplies", fn: () => openStore(false, "fort") });
        items.push({ label: "Rest a day", fn: () => restDays(1) });
      }
      items.push({ label: "Check supplies", fn: showSupplies });
      items.push({ label: "Look at the map", fn: showMap });
    }
    choices(items);
    saveGame();

  function riverMenu(lm) {
    const rain = S.weather === "rain" || S.weather === "flood watch";
    const width = lm.width + (rain || S.weather === "dust" ? 80 : 0);
    const depth = +(lm.depth + (rain ? 1.2 : 0)).toFixed(1);
    const ferry = lm.ferry || 0;
    const traffic = lm.obstacle === "traffic";
    clearUI(); showHud(true); setArt(traffic ? ART.traffic : ART.river);
    setText(
      traffic
        ? (lm.name + "\n\nThe merge is " + width + " feet of bumper-to-bumper robotaxis, " + depth + " lanes deep.\nWeather: " + S.weather + ".\n\nYou may nose in, wait for a gap, " + (ferry ? "hire a robotaxi escort for " + money(ferry) + ", " : "") + "or sit a day and hope it thins out.")
        : (lm.name + "\n\nThe flooded crossing is " + width + " feet wide and " + depth + " feet deep today.\nWeather: " + S.weather + ".\n\nYou may drive through, take the service road, " + (ferry ? "hire a tow for " + money(ferry) + ", " : "") + "or wait for the water to drop.")
    );
    const items = traffic
      ? [
          { label: "Nose into the merge", fn: () => crossRiver(lm, "ford", width, depth) },
          { label: "Wait for a gap and lunge", fn: () => crossRiver(lm, "float", width, depth) }
        ]
      : [
          { label: "Drive through the water", fn: () => crossRiver(lm, "ford", width, depth) },
          { label: "Take the service road", fn: () => crossRiver(lm, "float", width, depth) }
        ];
    if (ferry) items.push({ label: (traffic ? "Hire a robotaxi escort (" : "Hire a tow (") + money(ferry) + ")", fn: () => crossRiver(lm, "ferry", width, depth) });
    items.push({ label: "Wait 1 day", fn: () => {
      S.date = addDays(S.date, 1); setWeather(S); tickDailyHealth(S);
      if (S.over) return;
      showEvent("", story("crossingWait"), [{ label: "Check the crossing again", fn: () => riverMenu(lm) }]);
    }});
    choices(items);
  }

  function crossRiver(lm, method, width, depth) {
    let risk = 0;
    if (method === "ford") risk = depth > 4 ? 0.55 : depth > 3 ? 0.3 : 0.12;
    if (method === "float") risk = depth > 5 ? 0.35 : 0.2;
    if (method === "ferry") {
      if (S.cash < (lm.ferry || 0)) {
        showEvent("", story("ferryNoMoney"), [{ label: "Back", fn: () => riverMenu(lm) }]);
        return;
      }
      S.cash -= lm.ferry;
      risk = 0.04;
    }
    if (width > 600) risk += 0.08;
    if (S.battery < 30) risk += 0.1;
    const fail = chance(risk);
    S.date = addDays(S.date, 1);
    tickDailyHealth(S);
    if (S.over) return;
    if (!fail) {
      log(S, "You got through " + lm.name + ".");
      const traffic = lm.obstacle === "traffic";
      const pool = method === "ferry" ? (traffic ? "ferrySuccessTraffic" : "ferrySuccessWater")
        : method === "float" ? (traffic ? "floatSuccessTraffic" : "floatSuccessWater")
        : (traffic ? "trafficSuccess" : "fordSuccessWater");
      showEvent(traffic ? ART.traffic : ART.river, story(pool, { name: founder(S).name }), [{ label: "Continue", fn: showTrail }]);
      return;
    }
    const roll = Math.random();
    if (roll < 0.35) {
      const loss = Math.min(S.ramen, 20 + rand(80));
      S.ramen -= loss;
      log(S, "You lost " + loss + " snack packs in the crossing.");
      showEvent(lm.obstacle === "traffic" ? ART.traffic : ART.river, story(lm.obstacle === "traffic" ? "crossFailSnacksTraffic" : "crossFailSnacksWater", { n: loss }), [{ label: "Continue", fn: showTrail }]);
    } else if (roll < 0.6) {
      const part = pick(["tires", "gpus", "chargers"]);
      const need = brokenPart(part, true);
      if (!S.over) showEvent(lm.obstacle === "traffic" ? ART.traffic : ART.river, story(lm.obstacle === "traffic" ? "crossFailPartTraffic" : "crossFailPartWater", { part: partLabel(part) }), [{ label: "Continue", fn: () => (need && ui.pending ? ui.pending() : showTrail()) }]);
    } else if (roll < 0.85 && S.battery > 0) {
      const lost = Math.min(S.battery, 10 + rand(20));
      S.battery -= lost;
      log(S, "You lost " + lost + " kWh in the crossing.");
      showEvent(lm.obstacle === "traffic" ? ART.traffic : ART.river, story(lm.obstacle === "traffic" ? "crossFailBatteryTraffic" : "crossFailBatteryWater", { n: lost }), [{ label: "Continue", fn: showTrail }]);
    } else {
      const others = alive(S).filter(x => x.role !== "Founder");
      const p = pick(others.length ? others : alive(S));
      if (p) { p.health = 0; checkDeaths(S, lm.obstacle === "traffic" ? "the merge" : "the crossing"); }
      if (!S.over) showEvent(lm.obstacle === "traffic" ? ART.traffic : ART.river, story(lm.obstacle === "traffic" ? "crossFailPersonTraffic" : "crossFailPersonWater"), [{ label: "Continue", fn: showTrail }]);
    }
  }

  function showEvent(art, text, items) {
    ui.eventOpen = true;
    ui.screen = "event";
    clearUI(); showHud(true);
    if (art) setArt(art);
    setText(text);
    choices(items);
    saveGame();
  }

  function partLabel(part) {
    return ({ tires: "tire", gpus: "GPU", chargers: "charger", battery: "battery pack" })[part] || part.replace(/s$/, "");
  }

  function brokenPart(part, fromRiver) {
    const name = partLabel(part);
    if (S[part] > 0) {
      S[part]--;
      log(S, story("breakdownUsedSpareLog", { part: name }));
      return false;
    }
    const waitFix = function () {
      ui.eventOpen = true;
      ui.screen = "event";
      clearUI(); showHud(true);
      setText(story("brokenNoSpare", { part: name }));
      choices([
        { label: "Spend 3 days repairing it", fn: () => {
          for (let i = 0; i < 3; i++) {
            if (S.over) return;
            S.date = addDays(S.date, 1); setWeather(S); tickDailyHealth(S);
          }
          log(S, story("repairImprov", { part: name }));
          if (!S.over) showTrail();
        }},
        { label: "Try to trade for a spare", fn: () => {
          if (chance(0.5) && (S.ramen >= 40 || S.cash >= 15)) {
            if (S.cash >= 15 && chance(0.5)) S.cash -= 15;
            else S.ramen = Math.max(0, S.ramen - 40);
            log(S, "You traded for a spare " + name + ".");
            showEvent("", story("repairTradeYes", { part: name }), [{ label: "Continue", fn: showTrail }]);
          } else {

  function showDemoDay() {
    clearUI(); showHud(true); setArt(ART.town);

    const aliveN = livingCount(S);
    const ev = { startup: S.startup, alive: aliveN, ownership: Math.round(S.ownership), name: founder(S).name };
    let key = late ? "winArriveLate" : aliveN === 5 ? "winArriveFull" : aliveN === 1 ? "winArriveAlone" : "winArriveMost";
    let speech = story(key, ev);
    if (S.ownership >= 80) speech += "\n\n" + story("winFlavorHighOwn", ev);
    else if (S.ownership < 60) speech += "\n\n" + story("winFlavorDiluted", ev);
    setText(speech);
    choices([{ label: "Take the stage", fn: () => endGame(S, true, speech) }]);
  }

    clearUI(); showHud(false);

    t += (S.endMessage || "") + "\n\n";
    if (S.win) {
      if (S.score >= 2000) t += story("winFlavorHighScore") + "\n\n";
      else if (S.score < 800) t += story("winFlavorLowScore") + "\n\n";

      t += story("loseFlavor") + "\n\n";
    }
    t += S.founder + "  |  " + S.startup + "  |  " + FLAVORS[S.flavor].name + "\n";
    t += "Arrived or ended: " + fmtDate(S.date) + "\n";
    t += "Miles traveled: " + S.miles + " of " + TOTAL_MILES + "\n";
    t += "Team remaining: " + livingCount(S) + "\n";
    t += "Runway: " + money(S.cash) + "   Ramen: " + Math.round(S.ramen) + " packs   Battery: " + S.battery + " kWh\n";
    t += "Ownership: " + Math.round(S.ownership) + "%\n\n";
    t += "SCORE: " + S.score + "  (x" + FLAVORS[S.flavor].multiplier + " flavor, x" + (Math.round(S.ownership) / 100) + " ownership)\n\n";
    if (S.graves.length) {
      t += "GONE FROM THE COMPANY\n";
      S.graves.forEach(g => { t += "  " + g.text + "\n"; });
    }
    setText(t);
    choices([
      { label: "See the Demo Day Top Ten", fn: showScores },
      { label: "Travel the trail again", fn: showTitle }
    ]);
  }

  window.__StartupTrail__ = {
    getState: function () { return S; },
    setState: function (g) { S = g; },
    LANDMARKS: LANDMARKS,
    FLAVORS: FLAVORS,
    ILLNESSES: ILLNESSES,
    STORE_ITEMS: STORE_ITEMS,
    STORIES: STORIES,
    LANDMARK_BLURBS: LANDMARK_BLURBS,
    pickFrom: pickFrom,
    showTitle: showTitle,
    showTrail: showTrail,
    showEnd: showEnd,
    purchaseAndDepart: function (buy) {
      ui.storeBuy = Object.assign({ battery: 0, ramen: 0, chargers: 0, totes: 0, tires: 0, gpus: 0 }, buy || {});
      const loc = ui.storeKind === "start" ? "start" : "fort";
      const prices = pricesAt(loc);
      const spent = STORE_ITEMS.reduce((s, it) => s + (ui.storeBuy[it.key] || 0) * prices[it.key], 0);
      checkoutStore(prices, spent);
    }
  };

  showTitle();
})();
</script>
<script data-goatcounter="https://jrperiod.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
